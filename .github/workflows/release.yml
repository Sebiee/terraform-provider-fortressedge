# Publishes a release the Terraform Registry picks up.
#
# A v* tag pushed by hand releases that tag. A push to main that moves the
# fortressedge version in go.mod (merging Dependabot's update) tags the next
# version and releases it in the same run: a tag pushed with GITHUB_TOKEN
# starts no workflow by itself. The provider's major.minor is
# fortressedge's (scripts/next-version.sh).
#
# Secrets: GPG_PRIVATE_KEY (ASCII-armored) and PASSPHRASE, for the key whose
# public half is registered with the registry.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

jobs:
  tag:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Next version
        id: next
        env:
          BEFORE: ${{ github.event.before }}
        run: scripts/next-version.sh "$BEFORE" >> "$GITHUB_OUTPUT"
      - name: Tag
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  goreleaser:
    needs: tag
    if: >-
      !cancelled() && needs.tag.result != 'failure' &&
      (github.ref_type == 'tag' || needs.tag.outputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref || format('refs/tags/{0}', needs.tag.outputs.tag) }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: fortressedge is a released module, with its pins
        run: |
          if grep -q '^replace github.com/Sebiee/fortressedge ' go.mod; then
            echo "::error::go.mod replaces github.com/Sebiee/fortressedge with a local path; go get a version first"
            exit 1
          fi
          scripts/check-pins.sh
      - name: Test
        run: go test ./...
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      # Build provenance, signed by GitHub: which workflow run and commit
      # made each zip. gh attestation verify checks it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
