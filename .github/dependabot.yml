version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Daily, so a fortressedge release reaches the provider within a day.
  # fortressedge comes in a pull request of its own: merging it releases
  # the provider (release.yml).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    groups:
      fortressedge:
        patterns: ["github.com/Sebiee/fortressedge"]
      minor:
        update-types: [minor, patch]
        exclude-patterns: ["github.com/Sebiee/fortressedge"]
